[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "probability-dynamics-lab"
version = "0.1.0"
description = "Research notes and reproducible benchmarks for stochastic dynamics, coarse graining, and learned probability flows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.11", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]
experiments = ["torch"]
audit = ["sympy>=1.14"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "experiments"]
cache_dir = "build/cache/pytest"

[tool.ruff]
target-version = "py310"
line-length = 100
cache-dir = "build/cache/ruff"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff.lint.per-file-ignores]
# Plotting modules must select the headless backend before importing pyplot.
"experiments/*.py" = ["E402"]
